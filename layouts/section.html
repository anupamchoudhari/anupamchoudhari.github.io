{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Params.subtitle }}<p class="subtitle">{{ . }}</p>{{ end }}
</header>
{{ .Content }}
{{ with .Pages }}
  {{ partial "post-list.html" . }}
{{ else }}
  <p class="empty">Nothing here yet. It's brewing.</p>
{{ end }}
{{ end }}

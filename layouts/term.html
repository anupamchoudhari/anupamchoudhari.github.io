{{ define "main" }}
<section class="view">
  {{ partial "crumb.html" . }}
  <div class="page-head"><p class="eyebrow">Theme</p><h2>{{ .Title }}</h2></div>
  <div class="latest">
    {{ range .Pages }}{{ partial "row.html" (dict "page" . "where" (.CurrentSection.Title | strings.TrimPrefix "The ")) }}{{ end }}
  </div>
</section>
{{ end }}

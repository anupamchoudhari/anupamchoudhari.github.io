# Builds the site with Hugo and publishes it to GitHub Pages on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo && sudo mv hugo /usr/local/bin/
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        # Pages reports http:// until the HTTPS certificate is issued; always link over https.
        run: |
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          hugo --gc --minify --baseURL "${BASE_URL/http:/https:}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

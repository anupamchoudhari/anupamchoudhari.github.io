{{/* Road Trip Mode: the Konami egg. Stops live in data/roadtrip.yaml. */}}
<div class="rt" id="road-trip" hidden>
  <div class="rt-inner">
    <p class="muted">You found the road trip.</p>
    <h2>Four years, two home bases, a lot of interstate</h2>
    <ul class="route">
      {{ range hugo.Data.roadtrip }}
      <li><span class="yr">{{ .when }}</span><span class="stop">{{ .place }}</span><span class="note">{{ .note }}</span></li>
      {{ end }}
    </ul>
    <p><button class="linkish" id="road-trip-close" type="button" style="font-size:1rem;color:var(--link)">Back to the site</button></p>
  </div>
</div>

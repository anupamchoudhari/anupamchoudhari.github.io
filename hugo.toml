# Site config. Content lives in content/<section>/<slug>.md
baseURL = "https://www.anupamchoudhari.com/"
locale = "en"
title = "Anupam Choudhari"
enableRobotsTXT = true
disableKinds = []

[params]
  description = "Making AI products dependable: prototypes, the frameworks behind them, books worth arguing with, and coffee."
  author = "Anupam Choudhari"
  ogImage = "images/og-default.png"   # default share image; a page can set `image:` in front matter
  # Page views: paste the token from Cloudflare > Web Analytics > Add a site. Empty = no tracking.
  cloudflareAnalyticsToken = "5323d8b2dd3748e38e77c2f94706a5ef"
  ogImageAlt = "Making AI stick. Models are probabilistic. Products can't be."
  # "On this page" nav on long posts. A post can force it with `toc: true` or hide it with `toc: false`.
  [params.toc]
    minWords = 1500

# Every post lives at a flat address: anupamchoudhari.com/<slug>
# Moving a post to another section folder never changes its link.
[permalinks.page]
  workbench = "/:slug/"
  toolkit = "/:slug/"
  three-takeaways = "/:slug/"
  mildly-annoying = "/:slug/"
  parents-corner = "/:slug/"
  currently-brewing = "/:slug/"

[taxonomies]
  theme = "themes"

[menus]
  [[menus.main]]
    name = "The Workbench"
    pageRef = "/workbench"
    weight = 10
  [[menus.main]]
    name = "The Toolkit"
    pageRef = "/toolkit"
    weight = 20
  [[menus.main]]
    name = "Three Takeaways"
    pageRef = "/three-takeaways"
    weight = 30
  [[menus.main]]
    name = "Mildly Annoying"
    pageRef = "/mildly-annoying"
    weight = 40
  [[menus.main]]
    name = "Parents Corner"
    pageRef = "/parents-corner"
    weight = 50
  [[menus.main]]
    name = "Currently Brewing"
    pageRef = "/currently-brewing"
    weight = 60
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 70

[markup.goldmark.renderer]
  unsafe = true   # allow raw HTML in posts (embeds, demos)

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.highlight]
  noClasses = false
